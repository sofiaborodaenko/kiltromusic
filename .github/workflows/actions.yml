name: Run web scraper

on: [workflow_dispatch]

jobs:
    build: 
        runs-on: ubuntu-latest

        steps:
        - name: Checkout repository
          uses: actions/checkout@v2

        - name: Set up Python
          uses: actions/setup-python@v2
          with:
              python-version: '3.9'

        - name: Install dependencies
          run: |
              python -m pip install --upgrade pip
              pip install scrapy scrapy-playwright

        - name: Run web scraper
          run: |
              cd scrappingtickets
              scrapy crawl tickets_spider

        - name: Commit and push changes
          uses: stefanzweifel/git-auto-commit-action@v4
          with:
              commit_message: Update ticket data
          id: auto-commit-action

        - name: Send Email
          if: steps.auto-commit-action.outputs.committed == 'true'
          uses: dawidd6/action-send-mail@v3
          with:
              server_address: smtp.gmail.com
              server_port: 465
              username: ${{ secrets.EMAIL_USERNAME }}
              password: ${{ secrets.EMAIL_PASSWORD }}
              subject: Ticket Data Updated
              body: The ticket data has been successfully updated and committed to the repository.
              to: soph.bor06@gmail.com
              from: Scrappy Web Server
              html_body: file://data/ticketdata.json
              convert_markdown: true